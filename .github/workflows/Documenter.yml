name: Documenter

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create XyceSolver_jll stub
        run: |
          mkdir -p ../XyceSolver_jll/src
          cat > ../XyceSolver_jll/Project.toml <<'EOF'
          name = "XyceSolver_jll"
          uuid = "7b6e6b8f-6a2f-4f9c-89d0-0d4b9f7a6e31"
          version = "0.1.0"
          EOF
          cat > ../XyceSolver_jll/src/XyceSolver_jll.jl <<'EOF'
          module XyceSolver_jll

          export xycesolver_julia

          end
          EOF

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1'

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v2
        with:
          cache-registries: true

      - name: Install docs dependencies
        run: julia --project=docs -e 'using Pkg; Pkg.develop(path="."); Pkg.instantiate()'

      - name: Build and deploy docs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          JYCE_ALLOW_MISSING_NATIVE: "1"
        run: julia --project=docs docs/make.jl